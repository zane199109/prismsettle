# Local dev config — connects to Docker postgres/redis via exposed ports.
# Run: go run ./cmd/... -config ../config/dev-local.yaml
env: "dev"
server:
  port: "9527"
  mode: "debug"
  log_path: "/tmp/prismsettle-logs"
  read_timeout: 30
  write_timeout: 30
  idle_timeout: 120
  shutdown_listener_timeout: 20
  shutdown_httpserver_timeout: 20

rate_limit:
  per_minute: 120
  daily_limit: 100000

auth:
  tokens: ["dev-token"]

postgres:
  host: "127.0.0.1"
  port: 5433
  user: "prism"
  password: "prism@2026"
  dbname: "prismsettle"
  max_idle_conns: 10
  max_open_conns: 50
  conn_max_lifetime: 3600s

redis:
  host: "127.0.0.1"
  port: 6380
  password: ""
  db: 0
  pool_size: 10
  timeout: 5

web3:
  chains:
    # PrismSettleRegistry on Monad testnet
    - chain_name: "monad_testnet"
      chain_type: "evm"
      abi_type: "erc20"
      rpc_urls:
        - "https://testnet-rpc.monad.xyz"
      contract_addr: "0xe6Fb9e7788Ab7BCD1622485fb0F2dED9092C7A67"
      contract_parser: PrismSettle
      start_block: 51932000
      workers: 5
      batch_size_db: 200
      batch_size_sync: 100
      confirmations: 3
      timeout: 30
      decimals: 18
      sync_interval: 1000
      commit_step: 10
      block_cache_size: 1000
      reorg_min_depth: 3
      task_queue_size: 100
      task_backpressure_seconds: 30
      task_send_retry_ms: 100
      block_number_retry_seconds: 5
      permanent_failure_sleep_seconds: 60
      lock_expiration_seconds: 30
      max_sync_retries: 5
      native_symbol: "MON"
      native_decimals: 18

    # PrismSettleJob on Monad testnet
    - chain_name: "monad_testnet"
      chain_type: "evm"
      abi_type: "erc20"
      rpc_urls:
        - "https://testnet-rpc.monad.xyz"
      contract_addr: "0xC1aC936f57B983381E08BA0417CC1999C04DC6aF"
      contract_parser: PrismSettleJob
      start_block: 51932000
      workers: 5
      batch_size_db: 200
      batch_size_sync: 100
      confirmations: 3
      timeout: 30
      decimals: 18
      sync_interval: 1000
      commit_step: 10
      block_cache_size: 1000
      reorg_min_depth: 3
      task_queue_size: 100
      task_backpressure_seconds: 30
      task_send_retry_ms: 100
      block_number_retry_seconds: 5
      permanent_failure_sleep_seconds: 60
      lock_expiration_seconds: 30
      max_sync_retries: 5
      native_symbol: "MON"
      native_decimals: 18

    # ArbitrationHook on Monad testnet
    - chain_name: "monad_testnet"
      chain_type: "evm"
      abi_type: "erc20"
      rpc_urls:
        - "https://testnet-rpc.monad.xyz"
      contract_addr: "0x9039554fc84deebB4923E4236390634371E853f9"
      contract_parser: PrismSettleHook
      start_block: 51932000
      workers: 5
      batch_size_db: 200
      batch_size_sync: 100
      confirmations: 3
      timeout: 30
      decimals: 18
      sync_interval: 1000
      commit_step: 10
      block_cache_size: 1000
      reorg_min_depth: 3
      task_queue_size: 100
      task_backpressure_seconds: 30
      task_send_retry_ms: 100
      block_number_retry_seconds: 5
      permanent_failure_sleep_seconds: 60
      lock_expiration_seconds: 30
      max_sync_retries: 5
      native_symbol: "MON"
      native_decimals: 18

evaluator:
  chain_id: 10143
  chain_name: "monad_testnet"
  rpc_url: "https://testnet-rpc.monad.xyz"
  registry_addr: "0xe6Fb9e7788Ab7BCD1622485fb0F2dED9092C7A67"
  job_addr: "0xC1aC936f57B983381E08BA0417CC1999C04DC6aF"
  hook_addr: "0x9039554fc84deebB4923E4236390634371E853f9"
  payment_token: "0x83cb612C10a27C09b7a5Ab31B906560B880abD9C"
  # Demo: wait this long before executing the arbitration result. Must be >=
  # the on-chain announcementPeriod (deployed at 20s); 25s keeps the whole
  # arbitration scene inside the 3-minute window.
  announcement_wait_sec: 25
  poll_interval: 2
  batch_size: 20
  keeper_tick_sec: 30