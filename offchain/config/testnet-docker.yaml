# PrismSettle testnet-docker config — connects Docker containers to Monad testnet.
# postgres/redis use Docker service names; RPC points to testnet-rpc.monad.xyz.
env: "dev"
server:
  port: "9527"
  mode: "debug"
  log_path: "/app/logs"
  read_timeout: 30
  write_timeout: 30
  idle_timeout: 120
  shutdown_listener_timeout: 20
  shutdown_httpserver_timeout: 20

rate_limit:
  per_minute: 120
  daily_limit: 100000

auth:
  tokens: ["dev-token"]

postgres:
  host: "postgres"
  port: 5432
  user: "prism"
  password: "prism@2026"
  dbname: "prismsettle"
  ssl_mode: disable
  max_idle_conns: 10
  max_open_conns: 50
  conn_max_lifetime: 3600s

redis:
  host: "redis"
  port: 6379
  password: ""
  db: 0
  max_retries: 3
  min_retry_backoff: 100ms
  max_retry_backoff: 1s
  idle_timeout: 5m
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s

web3:
  chains:
    # PrismSettleRegistry on Monad testnet
    - chain_name: "monad_testnet"
      chain_type: "evm"
      abi_type: "erc20"
      rpc_urls:
        - "https://testnet-rpc.monad.xyz"
      contract_addr: "0xe6Fb9e7788Ab7BCD1622485fb0F2dED9092C7A67"
      contract_parser: PrismSettle
      start_block: 51701940
      confirmations: 5
      decimals: 18
      workers: 2
      batch_size_db: 100
      batch_size_sync: 50
      sync_interval: 1000
      commit_step: 10
      timeout: 20
      block_cache_size: 1024
      reorg_min_depth: 64
      task_queue_size: 100
      task_backpressure_seconds: 30
      task_send_retry_ms: 100
      block_number_retry_seconds: 5
      permanent_failure_sleep_seconds: 30
      lock_expiration_seconds: 60
      max_sync_retries: 5
      native_symbol: "MON"
      native_decimals: 18

    # PrismSettleJob on Monad testnet
    - chain_name: "monad_testnet"
      chain_type: "evm"
      abi_type: "erc20"
      rpc_urls:
        - "https://testnet-rpc.monad.xyz"
      contract_addr: "0xC1aC936f57B983381E08BA0417CC1999C04DC6aF"
      contract_parser: PrismSettleJob
      start_block: 51701940
      confirmations: 5
      decimals: 18
      workers: 2
      batch_size_db: 100
      batch_size_sync: 50
      sync_interval: 1000
      commit_step: 10
      timeout: 20
      block_cache_size: 1024
      reorg_min_depth: 64
      task_queue_size: 100
      task_backpressure_seconds: 30
      task_send_retry_ms: 100
      block_number_retry_seconds: 5
      permanent_failure_sleep_seconds: 30
      lock_expiration_seconds: 60
      max_sync_retries: 5
      native_symbol: "MON"
      native_decimals: 18

    # ArbitrationHook on Monad testnet
    - chain_name: "monad_testnet"
      chain_type: "evm"
      abi_type: "erc20"
      rpc_urls:
        - "https://testnet-rpc.monad.xyz"
      contract_addr: "0x9039554fc84deebB4923E4236390634371E853f9"
      contract_parser: PrismSettleHook
      start_block: 51701940
      confirmations: 5
      decimals: 18
      workers: 2
      batch_size_db: 100
      batch_size_sync: 50
      sync_interval: 1000
      commit_step: 10
      timeout: 20
      block_cache_size: 1024
      reorg_min_depth: 64
      task_queue_size: 100
      task_backpressure_seconds: 30
      task_send_retry_ms: 100
      block_number_retry_seconds: 5
      permanent_failure_sleep_seconds: 30
      lock_expiration_seconds: 60
      max_sync_retries: 5
      native_symbol: "MON"
      native_decimals: 18

evaluator:
  # private_key is NOT hardcoded here — comes from PRISM_EVALUATOR_KEY env var.
  # The main.go reads it via os.Getenv("PRISM_EVALUATOR_KEY") and overrides.
  private_key: ""
  evaluator_address: "0xcc6142f3f79Dd1d42FC0446C5B7218C5F520021E"
  chain_id: 10143
  chain_name: "monad_testnet"
  rpc_url: "https://testnet-rpc.monad.xyz"
  registry_addr: "0xe6Fb9e7788Ab7BCD1622485fb0F2dED9092C7A67"
  job_addr: "0xC1aC936f57B983381E08BA0417CC1999C04DC6aF"
  hook_addr: "0x9039554fc84deebB4923E4236390634371E853f9"
  poll_interval: 2
  batch_size: 20
  keeper_tick_sec: 30

notify:
  telegram_token: ""
  chat_id: ""