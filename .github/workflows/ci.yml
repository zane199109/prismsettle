name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts (Foundry)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Cache Foundry
        uses: actions/cache@v4
        with:
          path: |
            ~/.foundry/cache
            contracts/cache
            contracts/out
          key: foundry-${{ runner.os }}-${{ hashFiles('contracts/foundry.toml', 'contracts/src/**/*.sol', 'contracts/test/**/*.sol') }}
          restore-keys: |
            foundry-${{ runner.os }}-

      - name: Check foundry.toml (Cancun EVM)
        run: |
          grep -q 'evm_version.*=.*"cancun"' foundry.toml || { echo '❌ foundry.toml missing evm_version = "cancun"'; exit 1; }
          grep -q 'solc_version.*=.*"0.8.24"' foundry.toml || { echo '❌ foundry.toml missing solc_version = "0.8.24"'; exit 1; }
          echo "✅ foundry.toml config OK (Cancun + 0.8.24)"

      - name: Forge build
        run: forge build

      - name: Forge test
        run: forge test -vvv

  offchain:
    name: Offchain (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: offchain
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prismsettle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/prismsettle_test?sslmode=disable
      REDIS_URL: redis://localhost:6379/0
      GO_TEST_MODE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: offchain/go.mod
          cache: true
          cache-dependency-path: offchain/go.sum

      - name: Go build
        run: go build ./...

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test -race -timeout 5m ./...

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    # Skip until frontend/ is created in Phase 7
    if: hashFiles('frontend/package.json') != ''
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test --passWithNoTests
